site_name: Everything Presence Grid
site_description: User and developer documentation for the Everything Presence Grid Home Assistant integration.
site_url: https://clintongormley.github.io/everything-presence-pro-grid/
repo_url: https://github.com/clintongormley/everything-presence-pro-grid
repo_name: clintongormley/everything-presence-pro-grid
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  superpowers/
  EppGrid TODO.txt

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

# ESP Web Tools powers the browser firmware flasher on user-guide/web-flasher.md.
# Loaded as a module site-wide so the <esp-web-install-button> custom element is
# defined regardless of how the page is reached (direct load or instant navigation).
extra_javascript:
  - path: https://unpkg.com/esp-web-tools@10/dist/web/install-button.js
    type: module

# Styles the web-flasher activate buttons (esp-web-tools leaves custom slotted
# buttons unstyled, so they render as plain text without this).
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Introduction: user-guide/introduction.md
    - Hardware: user-guide/hardware.md
    - Installation: user-guide/installation.md
    - Flashing firmware: user-guide/flashing-firmware.md
    - Web flasher: user-guide/web-flasher.md
    - Placement: user-guide/placement.md
    - Calibration: user-guide/calibration.md
    - Live overview: user-guide/live-overview.md
    - Heatmap: user-guide/heatmap.md
    - Detection zones: user-guide/detection-zones.md
    - Overlays: user-guide/overlays.md
    - How detection works: user-guide/how-detection-works.md
    - Furniture: user-guide/furniture.md
    - Backup and restore: user-guide/backup-restore.md
    - Settings:
      - user-guide/settings/index.md
      - Entities: user-guide/settings/entities.md
      - Detection ranges: user-guide/settings/detection-ranges.md
      - Sensor calibration: user-guide/settings/sensor-calibration.md
      - LED and relay: user-guide/settings/led-relay.md
      - Logging: user-guide/settings/logging.md
    - Device groups: user-guide/device-groups.md
    - Overview card: user-guide/overview-card.md
    - Automations: user-guide/automations.md
    - Firmware upgrades: user-guide/firmware-upgrades.md
    - Troubleshooting: user-guide/troubleshooting.md
  - Developers:
    - Overview: developers/index.md
    - Architecture: developers/architecture.md
    - Data catalog: developers/data-catalog.md
    - Code layout: developers/code-layout.md
    - Contributing: developers/contributing.md
