# Everything Presence Lite with the SCD40 CO2 add-on fitted.
#
# Identical to wifi-ble-lite.yaml plus the CO2 package. Flashing this to a board
# without the module leaves the scd4x component unable to reach its I2C device,
# which fails it and parks the app in error state — a permanently blinking
# status LED that ignores manual control. Use wifi-ble-lite.yaml for a bare
# board.
dashboard_import:
  package_import_url: github://${epp_repo_owner}/${epp_repo_name}/firmware/variants/wifi-ble-lite-co2.yaml@main
  import_full_config: false

substitutions:
  device_config:
    co2_enabled: true

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

packages:
   variant_defaults: !include ../common/lite-variant-defaults.yaml
   epp_core: !include ../common/epp-core.yaml
   epp_entities: !include ../common/epp-entities.yaml
   bh1750_base: !include ../common/bh1750-base.yaml
   lite_base: !include ../common/everything-presence-lite-base.yaml
   ld2450_lite_base: !include ../common/ld2450-lite-base.yaml
   bluetooth_base: !include ../common/bluetooth-base.yaml
   co2_lite_base: !include ../common/co2-lite-base.yaml
   wifi_base: !include ../common/wifi-base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://${epp_repo_owner}.github.io/${epp_repo_name}/fw/latest/wifi-ble-lite-co2.json
    # The eppgrid integration pins FIRMWARE_VERSION and surfaces version
    # mismatches via HA Repairs, so device-side polling (default 6h) is
    # redundant. set_update_manifest action and the OTA button still drive
    # this component for explicit checks/installs.
    update_interval: never
