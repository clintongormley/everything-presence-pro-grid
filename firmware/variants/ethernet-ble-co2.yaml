substitutions:
  name: "everything-presence-pro"
  friendly_name: "Everything Presence Pro"
  hidden_ssid: "false"
  factory_reset_disabled: "true"
  uart_target_output_disabled: "true"
  uart_presence_output_disabled: "true"
  log_level: "DEBUG"

  device_config:
    ethernet_enabled: true
    co2_enabled: true
    bluetooth_enabled: true
    board_revision: "1.8"
    sensor_variant: "ld2450+sen0609"
    firmware_channel: "stable"
    model: "everything-presence-pro"

dashboard_import:
  package_import_url: github://clintongormley/everything-presence-pro-grid/firmware/variants/ethernet-ble-co2.yaml@main
  import_full_config: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

packages:
   pro_base: !include ../common/everything-presence-pro-base.yaml
   ld2450_base: !include ../common/ld2450-base.yaml
   sen0609_base: !include ../common/sen0609-base.yaml
   ethernet_base: !include ../common/ethernet-base.yaml
   bluetooth_base: !include ../common/bluetooth-base.yaml
   co2_base: !include ../common/co2-base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://github.com/clintongormley/everything-presence-pro-grid/releases/latest/download/everything-presence-pro-ethernet-ble-co2-manifest.json
