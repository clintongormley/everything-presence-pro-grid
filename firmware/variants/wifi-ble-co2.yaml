# Substitutions / device_config live in ../common/variant-defaults.yaml
# (included below); this variant uses its defaults unchanged
# (ethernet_enabled: false).

dashboard_import:
  package_import_url: github://clintongormley/everything-presence-pro-grid/firmware/variants/wifi-ble-co2.yaml@main
  import_full_config: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

packages:
   variant_defaults: !include ../common/variant-defaults.yaml
   pro_base: !include ../common/everything-presence-pro-base.yaml
   ld2450_base: !include ../common/ld2450-base.yaml
   sen0609_base: !include ../common/sen0609-base.yaml
   bluetooth_base: !include ../common/bluetooth-base.yaml
   co2_base: !include ../common/co2-base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://clintongormley.github.io/everything-presence-pro-grid/fw/latest/wifi-ble-co2.json
    # The eppgrid integration pins FIRMWARE_VERSION and surfaces version
    # mismatches via HA Repairs, so device-side polling (default 6h) is
    # redundant. set_update_manifest action and the OTA button still drive
    # this component for explicit checks/installs.
    update_interval: never

wifi:
  on_connect:
    then:
      - script.execute: control_leds

  on_disconnect:
    then:
      - script.execute: control_leds

improv_serial:
  next_url: http://{{ip_address}}

