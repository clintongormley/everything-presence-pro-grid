# Substitutions / device_config live in ../common/variant-defaults.yaml
# (included below); this variant uses its defaults unchanged
# (ethernet_enabled: false).

dashboard_import:
  package_import_url: github://${epp_repo_owner}/${epp_repo_name}/firmware/variants/wifi-ble-co2.yaml@main
  import_full_config: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

packages:
   variant_defaults: !include ../common/variant-defaults.yaml
   epp_core: !include ../common/epp-core.yaml
   epp_entities: !include ../common/epp-entities.yaml
   bh1750_base: !include ../common/bh1750-base.yaml
   pro_base: !include ../common/everything-presence-pro-base.yaml
   ld2450_base: !include ../common/ld2450-base.yaml
   sen0609_base: !include ../common/sen0609-base.yaml
   bluetooth_base: !include ../common/bluetooth-base.yaml
   co2_base: !include ../common/co2-base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True
  # ESPHome does not include esp_wifi.h transitively on the ESP32 (its
  # wifi_component.h gates esp_wifi_types.h behind SOC_WIFI_SUPPORT_5G), so the
  # IDF headers the on_boot lambda needs are named here. `<...>` entries are
  # emitted at the top of main.cpp; the helper carries the disconnect-reason
  # table and the rollover-safe downtime maths, host-tested and free of IDF.
  includes:
    - <esp_event.h>
    - <esp_wifi.h>
    - ../lib/epp_component_helpers/include/epp_wifi_diag.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // WiFi drop diagnostics (issue #291): a device that falls off WiFi
            // can't tell us so while it is off WiFi, and tethering it over USB
            // moves it away from the spot where it fails. So it records the drop
            // and publishes once the link is back.
            //
            // ESPHome logs the disconnect reason but exposes no getter for it,
            // and its wifi_signal sensor polls once a minute — up to 60s stale by
            // the time the link drops. The raw IDF event carries both the reason
            // code and the RSSI at the instant of the drop.
            //
            // The reason table in epp_wifi_diag.h hardcodes the codes so it can be
            // host-tested without ESP-IDF. Anchor it to the real constants here,
            // where IDF is in scope: a renumbering then breaks the build instead
            // of silently mislabelling every drop in the field.
            static_assert(WIFI_REASON_DISASSOC_DUE_TO_INACTIVITY == 4, "IDF renumbered WIFI_REASON_*");
            static_assert(WIFI_REASON_ASSOC_LEAVE == 8, "IDF renumbered WIFI_REASON_*");
            static_assert(WIFI_REASON_BSS_TRANSITION_DISASSOC == 12, "IDF renumbered WIFI_REASON_*");
            static_assert(WIFI_REASON_BEACON_TIMEOUT == 200, "IDF renumbered WIFI_REASON_*");
            static_assert(WIFI_REASON_NO_AP_FOUND == 201, "IDF renumbered WIFI_REASON_*");
            static_assert(WIFI_REASON_NO_AP_FOUND_IN_RSSI_THRESHOLD == 212, "IDF renumbered WIFI_REASON_*");

            // The handler runs in the IDF event task, NOT the ESPHome loop, so it
            // may only touch the plain record — calling publish_state() here would
            // reach into the single-threaded loop from another task. The wifi
            // triggers below publish.
            //
            // record_disconnect() ignores everything but the first event of an
            // outage. IDF re-fires this event on every failed reconnect attempt,
            // so recording the latest one would describe the last retry instead of
            // the drop; see epp_wifi_diag.h.
            const esp_err_t err = esp_event_handler_instance_register(
                WIFI_EVENT, WIFI_EVENT_STA_DISCONNECTED,
                [](void *, esp_event_base_t, int32_t, void *event_data) {
                  auto *ev = static_cast<wifi_event_sta_disconnected_t *>(event_data);
                  epp::record_disconnect(epp::wifi_drop_state, ev->reason, ev->rssi, esphome::millis());
                },
                nullptr, nullptr);
            if (err != ESP_OK) {
              // Loud, because the failure is otherwise invisible: every entity
              // below would simply stay quiet, which is exactly what a device with
              // no drops looks like. A diagnostic that fails into a reassuring
              // reading is worse than no diagnostic at all.
              ESP_LOGE("wifi_diag", "WiFi drop diagnostics unavailable: handler registration failed (%s)",
                       esp_err_to_name(err));
            }

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://${epp_repo_owner}.github.io/${epp_repo_name}/fw/latest/wifi-ble-co2.json
    # The eppgrid integration pins FIRMWARE_VERSION and surfaces version
    # mismatches via HA Repairs, so device-side polling (default 6h) is
    # redundant. set_update_manifest action and the OTA button still drive
    # this component for explicit checks/installs.
    update_interval: never

wifi:
  on_connect:
    then:
      - script.execute: control_leds
      # The drop is described here, on the way back up, rather than as it happens.
      #
      # Nothing published during an outage reaches HA anyway: the device is
      # offline, so a published state merely sits in the entity until the API
      # reconnects and ESPHome ships it in the initial-state burst. Only the value
      # held at reconnect is ever transmitted — so publishing here loses nothing,
      # and it keeps the read of the event-task record well clear of the write.
      #
      # take_drop() consumes the drop, so an ESPHome-level reconnect with no IDF
      # disconnect behind it (a roam scan, a lost DHCP lease) republishes nothing.
      #
      # The count publishes unconditionally, including the 0 on a first boot: the
      # user guide's headline test is "WiFi Disconnects stays at 0 while HA still
      # loses the device", and an entity left at `unknown` cannot say 0.
      - lambda: |-
          // Keep each `id(x).method()` on one line: ESPHome rewrites that form
          // textually before compiling, and a line break between the id() and
          // the `.` defeats the rewrite (the lambda then sees a raw pointer).
          const epp::DropReport report = epp::take_drop(epp::wifi_drop_state, esphome::millis());
          id(wifi_disconnect_count_sensor).publish_state((float) epp::wifi_drop_state.drops);
          if (report.has_drop) {
            id(wifi_disconnect_reason_sensor).publish_state(epp::wifi_disconnect_reason_str(report.reason));
            id(wifi_disconnect_rssi_sensor).publish_state((float) report.rssi);
            id(wifi_downtime_sensor).publish_state((float) report.downtime_ms / 1000.0f);
          }

  on_disconnect:
    then:
      - script.execute: control_leds
      # Republish the count as the link goes, so a device whose API session outlives
      # a brief blip reports the drop immediately rather than at reconnect. The
      # count itself is maintained by record_disconnect() in the event handler,
      # which counts outages rather than the retry storm inside one.
      - lambda: |-
          id(wifi_disconnect_count_sensor).publish_state((float) epp::wifi_drop_state.drops);

sensor:
  # RSSI as a diagnostic entity so a device dropping off WiFi can be diagnosed
  # from its real mounting location — signal otherwise only shows in the serial
  # connect banner, which requires tethering and so moves the device away from
  # the spot whose coverage you're measuring. Lives in this wifi variant, not
  # the shared base, because `wifi_signal` requires a `wifi:` component and the
  # ethernet variant has none (it would fail that variant's config). The
  # platform supplies device_class/unit (dBm)/state_class itself.
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    entity_category: diagnostic
    update_interval: 60s

  # WiFi drop diagnostics (issue #291). Published only from the wifi triggers
  # above — `update_interval: never` because nothing they report changes except
  # when the link does, so a healthy device sends nothing at all. How to read
  # them together is documented in docs/user-guide/troubleshooting.md
  # ("WiFi keeps dropping").

  # The discriminator: if HA keeps losing the device while this stays flat, the
  # association held and the fault is above WiFi entirely. Nothing we shipped
  # before could tell us that.
  - platform: template
    name: "WiFi Disconnects"
    id: wifi_disconnect_count_sensor
    entity_category: diagnostic
    icon: "mdi:wifi-off"
    accuracy_decimals: 0
    # Since-boot counter: total_increasing is what tells HA to read the reset to
    # 0 on reboot as a reset, not as a negative delta.
    state_class: total_increasing
    update_interval: never

  # RSSI at the instant of the drop — which WiFi Signal above cannot give us,
  # since at 60s it can be a minute stale by the time the link goes.
  - platform: template
    name: "WiFi Disconnect Signal"
    id: wifi_disconnect_rssi_sensor
    entity_category: diagnostic
    device_class: signal_strength
    unit_of_measurement: dBm
    accuracy_decimals: 0
    # No state_class: this latches the value from the last drop and holds it
    # indefinitely. As a `measurement` HA would record long-term statistics of a
    # constant — after one bad drop, a flat -90 dBm line sitting next to a live
    # WiFi Signal of -56 dBm, which reads as a permanently terrible signal.
    update_interval: never

  # How long the radio was actually gone, as opposed to how long HA thought it
  # was: the gap between the two is our reconnect path, not the network.
  - platform: template
    name: "WiFi Downtime"
    id: wifi_downtime_sensor
    entity_category: diagnostic
    device_class: duration
    unit_of_measurement: s
    accuracy_decimals: 0
    # No state_class, for the same reason as the signal above: this is an attribute
    # of the last outage, held until the next one, not a quantity being measured.
    update_interval: never

text_sensor:
  # Why the link went away — the AP kicked us, or we stopped hearing it. ESPHome
  # only ever logs this, so without an entity it is invisible to any user who
  # can't tether the device.
  - platform: template
    name: "WiFi Disconnect Reason"
    id: wifi_disconnect_reason_sensor
    entity_category: diagnostic
    icon: "mdi:wifi-alert"
    update_interval: never

  # Which AP the device is associated with. On a mesh, a BSSID that changes at
  # every drop means the router is steering the device between nodes — which
  # from HA's side is indistinguishable from a firmware fault.
  - platform: wifi_info
    bssid:
      name: "WiFi BSSID"
      id: wifi_bssid_sensor
      entity_category: diagnostic

improv_serial:
  next_url: http://{{ip_address}}

