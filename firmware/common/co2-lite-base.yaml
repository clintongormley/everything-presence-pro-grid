# SCD40 CO2 sensor on the Everything Presence Lite's expansion header.
#
# Kept separate from co2-base.yaml (the Pro's) because that file is half LED
# code: the Pro drives its RGB LED from the CO2 reading, so its `co2.on_value`
# runs `control_leds` and it `!extend`s the LED scripts to colour the ring by
# air quality. None of that exists on a Lite, whose only indicator is a plain
# status LED. What is left once the LED coupling is removed is the sensor and
# its calibration button.
#
# Bus pins differ too: the Lite puts the header on GPIO26/GPIO27, the Pro on
# GPIO4/GPIO16.

i2c:
  - id: bus_b
    sda: GPIO26
    scl: GPIO27
    scan: true

sensor:
  - platform: scd4x
    i2c_id: bus_b
    id: scd40
    co2:
      name: "CO2"
      id: "co2"
      disabled_by_default: true
    automatic_self_calibration: false

button:
  - platform: template
    name: "Calibrate CO2"
    id: calibrate_scd40
    disabled_by_default: true
    on_press:
      - scd4x.perform_forced_calibration:
          value: 419
          id: scd40

interval:
  # The SCD40 is optional on the Lite's expansion header. When it is absent,
  # scd4x can't reach it over I2C and marks itself failed, which sets ESPHome's
  # global error state. The Lite's only indicator is a status_led
  # (everything-presence-lite-base.yaml), so that error blinks the LED forever —
  # a false alarm for hardware the owner simply chose not to fit. The Pro is
  # immune because its LED is a script-driven RGB ring, not a status_led.
  #
  # Rather than demote the LED to a plain light (which would silence *every*
  # fault — WiFi, API, BLE — not just this one), clear only the scd40
  # component's error. status_clear_error() walks every component and drops the
  # app-wide error bit only when nothing else still holds it, so a genuine fault
  # keeps the LED blinking while a missing CO2 module does not.
  #
  # scd4x probes its sensor from a deferred set_timeout (~1s after setup), so the
  # failure lands after on_boot has already run — an interval is what reliably
  # catches it. status_clear_error() self-guards (no-op when the bit is clear)
  # and a failed component never loops to re-raise it, so this settles to a
  # cheap no-op once the LED is steady.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: "return id(scd40).status_has_error();"
          then:
            - lambda: "id(scd40).status_clear_error();"
