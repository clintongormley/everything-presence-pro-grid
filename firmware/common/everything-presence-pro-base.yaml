esphome:
  project:
    name: EverythingSmartTechnology.Everything Presence Pro
    version: "1.2.0"
  on_boot:
    - priority: 375
      then:
        - delay: 200ms
        - script.execute: update_relay_state
        # Start loading animation and keep it until API connects
        - light.turn_on:
            id: led_rgb
            brightness: 30%
            red: 0%
            green: 60%
            blue: 100%
            white: 0%
            effect: "Network Connecting"

external_components:
  - source:
      type: local
      path: ../components
    components: [epp]

epp:
  id: epp_component
  device_tracking:
    id: epp_zone_tracking
    name: "Zone Tracking"
    device_class: occupancy
    disabled_by_default: true
  firmware_version:
    name: "Zone Engine Version"
    entity_category: diagnostic
  zone_occupancy:
    zone_0:
      name: "Zone 0 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_1:
      name: "Zone 1 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_2:
      name: "Zone 2 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_3:
      name: "Zone 3 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_4:
      name: "Zone 4 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_5:
      name: "Zone 5 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_6:
      name: "Zone 6 Occupancy"
      device_class: occupancy
      disabled_by_default: true
    zone_7:
      name: "Zone 7 Occupancy"
      device_class: occupancy
      disabled_by_default: true
  target_positions:
    target_0:
      name: "Target 0 Position"
      disabled_by_default: true
    target_1:
      name: "Target 1 Position"
      disabled_by_default: true
    target_2:
      name: "Target 2 Position"
      disabled_by_default: true
  raw_target_positions:
    target_0:
      name: "Raw Target 0"
      disabled_by_default: true
    target_1:
      name: "Raw Target 1"
      disabled_by_default: true
    target_2:
      name: "Raw Target 2"
      disabled_by_default: true
  zone_state:
    name: "Zone State"
    disabled_by_default: true

# Enable logging
logger:

globals:
  - id: env_temp_offset
    type: float
    initial_value: '0'
  - id: env_humidity_offset
    type: float
    initial_value: '0'
  - id: env_illuminance_offset
    type: float
    initial_value: '0'
  - id: motion_timeout
    type: float
    initial_value: '10'
  - id: display_interval_ms
    type: uint32_t
    initial_value: '200'
  - id: zone_publish_interval_ms
    type: uint32_t
    initial_value: '1000'

# Enable Home Assistant API
api:
  id: api_id
  actions:
    - action: set_update_manifest
      variables:
        url: string
      then:
        - lambda: |-
            ESP_LOGI("fw", "Setting update manifest URL: %s", url.c_str());
            id(update_http_request).set_source_url(url);
        - component.update: update_http_request
        - delay: 1s
        - update.perform:
            id: update_http_request
            force_update: true
    - action: epp_set_perspective
      variables:
        perspective: string
        room_width: float
        room_depth: float
      then:
        - lambda: |-
            id(epp_component).set_perspective(perspective, room_width, room_depth);
    - action: epp_set_grid
      variables:
        grid_data: string
        origin_x: float
        origin_y: float
      then:
        - lambda: |-
            id(epp_component).set_grid(grid_data, origin_x, origin_y);
    - action: epp_set_zones
      variables:
        zones_json: string
      then:
        - lambda: |-
            id(epp_component).set_zones(zones_json);
    - action: epp_set_env_calibration
      variables:
        temperature_offset: float
        humidity_offset: float
        illuminance_offset: float
      then:
        - lambda: |-
            id(env_temp_offset) = temperature_offset;
            id(env_humidity_offset) = humidity_offset;
            id(env_illuminance_offset) = illuminance_offset;
            id(shtc3_sensor).update();
            id(illuminance_sensor).update();
    - action: epp_set_motion_timeout
      variables:
        timeout: float
      then:
        - lambda: |-
            id(motion_timeout) = timeout;
    - action: epp_set_tracking
      variables:
        max_range: float
      then:
        - lambda: |-
            id(tracking_max_range) = max_range;
    - action: epp_set_static_presence
      variables:
        min_range: float
        max_range: float
        trigger_range: float
        sustain_sensitivity: int
        trigger_sensitivity: int
        timeout: float
        on_delay: float
        led_enabled: bool
      then:
        - uart.write:
            id: uart_bus_dfrobot
            data: "sensorStop\r\n"
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setRange %.1f %.1f\r\n", min_range, max_range);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setTrigRange %.1f\r\n", trigger_range);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setSensitivity %d %d\r\n", sustain_sensitivity, trigger_sensitivity);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setLatency %.2f %.0f\r\n", on_delay, timeout);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              return led_enabled
                ? std::vector<unsigned char>{'s','e','t','L','e','d','M','o','d','e',' ','1',' ','0','\r','\n'}
                : std::vector<unsigned char>{'s','e','t','L','e','d','M','o','d','e',' ','1',' ','1','\r','\n'};
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: "saveConfig\r\n"
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: "sensorStart\r\n"
        - delay: 1s
    - action: epp_set_pipeline
      variables:
        display_interval: int
        zone_publish_interval: int
        window_duration: int
      then:
        - lambda: |-
            id(display_interval_ms) = display_interval;
            id(zone_publish_interval_ms) = zone_publish_interval;
            id(epp_component).set_window_duration(window_duration);
    - action: get_build_flags
      then:
        - api.respond:
            data: !lambda |-
              root["ethernet_enabled"]  = ${ device_config.ethernet_enabled | lower };
              root["co2_enabled"]       = ${ device_config.co2_enabled | lower };
              root["bluetooth_enabled"] = ${ device_config.bluetooth_enabled | lower };
              root["board_revision"]    = "${ device_config.board_revision }";
              root["sensor_variant"]    = "${ device_config.sensor_variant }";
              root["firmware_channel"]  = "${ device_config.firmware_channel }";
              root["model"]             = "${ device_config.model }";

  on_client_connected:
    then:
      # Wait until client has subscribed
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 3s
      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() != "Manual Control";'
          then:
            # Stop any effects first
            - light.turn_on:
                id: led_rgb
                effect: none
            # Smooth celebration sequence with flowing colors
            - light.turn_on:
                id: led_rgb
                brightness: 60%
                red: 0%
                green: 100%
                blue: 100%
                white: 0%
                transition_length: 400ms
            - delay: 400ms
            - light.turn_on:
                id: led_rgb
                brightness: 65%
                red: 0%
                green: 70%
                blue: 100%
                white: 0%
                transition_length: 350ms
            - delay: 350ms
            - light.turn_on:
                id: led_rgb
                brightness: 70%
                red: 50%
                green: 0%
                blue: 100%
                white: 0%
                transition_length: 350ms
            - delay: 350ms
            - light.turn_on:
                id: led_rgb
                brightness: 65%
                red: 100%
                green: 100%
                blue: 100%
                white: 0%
                transition_length: 400ms
            - delay: 500ms
      # Always restore to current mode, even if Manual Control
      - script.execute: control_leds

  on_client_disconnected:
    then:
      - script.execute: control_leds

http_request:
  verify_ssl: false

ota:
  - platform: esphome
  - platform: http_request
    id: ota_http_request

sensor:
  - platform: shtcx
    id: "shtc3_sensor"
    i2c_id: bus_a
    temperature:
      name: Temperature
      id: temperature_sensor
      filters:
        - lambda: "return x + id(env_temp_offset);"
    humidity:
      name: Humidity
      id: humidity_sensor
      filters:
        - lambda: "return x + id(env_humidity_offset);"
    address: 0x70
    update_interval: 30s
  
  - platform: bh1750
    name: Illuminance
    id: illuminance_sensor
    i2c_id: bus_a
    address: 0x23
    update_interval: 2s
    filters:
      - lambda: "return x + id(env_illuminance_offset);"
      - or:
          - throttle: 30s
          - delta: 2
      - clamp:
          min_value: 0

i2c:
  - id: bus_a
    scl: GPIO32
    sda: GPIO33
    scan: true

binary_sensor:
  - platform: gpio
    name: "Motion Presence"
    id: pir_motion
    device_class: motion
    disabled_by_default: true
    pin:
      number: GPIO36
    filters:
      - delayed_off: !lambda 'return id(motion_timeout) * 1000.0;'
    on_state:
      then:
        - lambda: |-
            auto mode = id(system_alarm_mode).current_option();
            if (mode == "Motion Only" || mode == "Motion or Presence") {
              bool activate = id(pir_motion).state;
              bool desired = (id(relay_contact_mode).current_option() == "Normally Open (NO)") ? activate : !activate;
              if (desired) {
                id(system_alarm_relay).turn_on();
              } else {
                id(system_alarm_relay).turn_off();
              }
            }

  - platform: template
    name: Occupancy
    id: occupancy
    device_class: occupancy
    lambda: |-
      if (id(dfrobot_presence).state || id(pir_motion).state || id(epp_zone_tracking).state) {
        return true;
      }
      return false;
    on_state:
      then:
        - lambda: |-
            auto mode = id(system_alarm_mode).current_option();
            if (mode == "Presence Only" || mode == "Motion or Presence") {
              bool activate = id(occupancy).state;
              bool desired = (id(relay_contact_mode).current_option() == "Normally Open (NO)") ? activate : !activate;
              if (desired) {
                id(system_alarm_relay).turn_on();
              } else {
                id(system_alarm_relay).turn_off();
              }
            }
        - if:
            condition:
              lambda: 'return id(led_mode_select).current_option() == "Presence" || id(led_mode_select).current_option() == "Environmental + Presence";'
            then:
              - script.execute: control_leds

  - platform: template
    name: mmWave Presence
    id: mmwave_occupancy
    device_class: occupancy
    disabled_by_default: true
    lambda: |-
      return id(dfrobot_presence).state || id(epp_zone_tracking).state;

light:
  - platform: esp32_rmt_led_strip
    id: led_rgb
    rgb_order: GRB
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    num_leds: 1
    chipset: sk6812
    name: "LED"
    effects:
      # Gentle breathing effects
      - pulse:
          name: "Slow Breathe"
          transition_length: 3s
          update_interval: 3s
          min_brightness: 5%
          max_brightness: 50%
      - pulse:
          name: "Medium Breathe"
          transition_length: 2s
          update_interval: 2s
          min_brightness: 10%
          max_brightness: 60%
      - pulse:
          name: "Fast Breathe"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 15%
          max_brightness: 70%

      # Presence detection effects - subtle, calming pulse
      - pulse:
          name: "Presence Glow"
          transition_length: 4s
          update_interval: 4s
          min_brightness: 40%
          max_brightness: 55%
      - pulse:
          name: "Presence Active"
          transition_length: 2.5s
          update_interval: 2.5s
          min_brightness: 45%
          max_brightness: 65%

      # Network status effects
      - pulse:
          name: "Network Connecting"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 20%
          max_brightness: 60%
      - strobe:
          name: "API Disconnected"
          colors:
            - state: true
              brightness: 20%
              red: 100%
              green: 0%
              blue: 100%
              white: 0%
              duration: 500ms
            - state: false
              duration: 2500ms

      # Environmental feedback effects
      # Good: No effect - steady glow
      - pulse:
          name: "Environmental Warning"
          transition_length: 1.5s
          update_interval: 1.5s
          min_brightness: 20%
          max_brightness: 50%
      - pulse:
          name: "Environmental Alert"
          transition_length: 800ms
          update_interval: 800ms
          min_brightness: 30%
          max_brightness: 65%

      # Smooth transition effects
      - pulse:
          name: "Gentle Fade"
          transition_length: 2s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%

select:
  - platform: template
    name: Relay Contact Mode
    id: relay_contact_mode
    entity_category: config
    optimistic: true
    options:
      - "Normally Open (NO)"
      - "Normally Closed (NC)"
    initial_option: "Normally Open (NO)"
    restore_value: true
    on_value:
      then:
        - script.execute: update_relay_state

  - platform: template
    name: Relay Trigger Mode
    id: system_alarm_mode
    entity_category: config
    optimistic: True
    options:
      - "Disabled"
      - "Motion Only"
      - "Presence Only"
      - "Motion or Presence"
    initial_option: "Disabled"
    restore_value: true
    on_value:
      then:
        - script.execute: update_relay_state

  - platform: template
    name: "LED Mode"
    id: led_mode_select
    entity_category: config
    optimistic: true
    options:
      - "Manual Control"
      - "Environmental"
      - "Presence"
      - "Environmental + Presence"
    initial_option: "Manual Control"
    restore_value: true
    icon: mdi:led-variant
    on_value:
      then:
        - script.execute: control_leds

script:
  - id: update_relay_state
    mode: restart
    then:
      - lambda: |-
          auto mode = id(system_alarm_mode).current_option();
          bool activate = false;

          if (mode == "Motion Only") {
            activate = id(pir_motion).state;
          } else if (mode == "Presence Only") {
            activate = id(occupancy).state;
          } else if (mode == "Motion or Presence") {
            activate = id(pir_motion).state || id(occupancy).state;
          }

          bool desired = (id(relay_contact_mode).current_option() == "Normally Open (NO)") ? activate : !activate;

          if (desired) {
            id(system_alarm_relay).turn_on();
          } else {
            id(system_alarm_relay).turn_off();
          }
 
  - id: control_leds
    mode: restart
    then:
      - lambda: |
          ESP_LOGD("control_leds", "Called - api_connected (subscribed): %d, led_mode: %s",
                   id(api_id).is_connected(), id(led_mode_select).current_option().c_str());

          // No API connection
          if (!id(api_id).is_connected()) {
            ESP_LOGD("control_leds", "Executing control_leds_connecting (no API)");
            id(control_leds_connecting).execute();
          }
          // Manual control mode
          else if (id(led_mode_select).current_option() == "Manual Control") {
            ESP_LOGD("control_leds", "Executing control_leds_manual");
            id(control_leds_manual).execute();
          }
          // Environmental mode
          else if (id(led_mode_select).current_option() == "Environmental") {
            ESP_LOGD("control_leds", "Executing control_leds_environmental");
            id(control_leds_environmental).execute();
          }
          // Presence mode
          else if (id(led_mode_select).current_option() == "Presence") {
            ESP_LOGD("control_leds", "Executing control_leds_presence");
            id(control_leds_presence).execute();
          }
          // Environmental + Presence combined mode
          else if (id(led_mode_select).current_option() == "Environmental + Presence") {
            ESP_LOGD("control_leds", "Executing control_leds_environmental_presence");
            id(control_leds_environmental_presence).execute();
          }

  # Connection state - blue pulsing
  - id: control_leds_connecting
    then:
      - light.turn_on:
          id: led_rgb
          brightness: !lambda 'return 0.30 * id(led_brightness_multiplier).state;'
          red: 0%
          green: 60%
          blue: 100%
          white: 0%
          transition_length: 500ms
      - delay: 550ms
      - light.turn_on:
          id: led_rgb
          effect: "Network Connecting"

  # Manual control - turn off
  - id: control_leds_manual
    then:
      - logger.log: "control_leds_manual: Turning off LED"
      - light.turn_on:
          id: led_rgb
          effect: none
      - delay: 50ms
      - light.turn_on:
          id: led_rgb
          brightness: 1%
          transition_length: 500ms
      - delay: 500ms
      - light.turn_off: led_rgb
      - logger.log: "control_leds_manual: LED turned off"

  # Environmental mode
  - id: control_leds_environmental
    then:
      - script.execute: update_environmental_led

  # Presence mode
  - id: control_leds_presence
    then:
      - if:
          condition:
            lambda: 'return id(occupancy).state;'
          then:
            # Presence detected - warm purple/magenta glow
            - light.turn_on:
                id: led_rgb
                effect: none
            - delay: 50ms
            - light.turn_on:
                id: led_rgb
                brightness: !lambda 'return 0.55 * id(led_brightness_multiplier).state;'
                red: 80%
                green: 20%
                blue: 100%
                white: 0%
                transition_length: 600ms
            - delay: 650ms
            - light.turn_on:
                id: led_rgb
                effect: "Presence Glow"
          else:
            # No presence - turn off
            - light.turn_on:
                id: led_rgb
                brightness: 1%
                transition_length: 500ms
            - delay: 500ms
            - light.turn_off: led_rgb

  # Placeholder for Environmental + Presence combined mode
  # Real implementation is in co2-base.yaml for CO2-enabled builds
  - id: control_leds_environmental_presence
    then:
      # Default: just show presence (no CO2 sensor)
      - script.execute: control_leds_presence

  # Placeholder for alternating presence and environmental display
  # Real implementation is in co2-base.yaml for CO2-enabled builds
  - id: alternate_presence_environmental
    mode: restart
    then:
      # Default: just show presence (no CO2 sensor)
      - script.execute: control_leds_presence

  # DEPRECATED - kept for backwards compatibility with CO2
  # Smooth transition helper - fades out before changing state
  - id: led_smooth_transition
    parameters:
      target_brightness: float
      target_red: float
      target_green: float
      target_blue: float
      target_effect: string
    then:
      # Always clear effects first to prevent them from continuing
      - light.turn_on:
          id: led_rgb
          effect: none
      - if:
          condition:
            light.is_on: led_rgb
          then:
            # Fade to 50% brightness first for smooth transition
            - light.turn_on:
                id: led_rgb
                brightness: !lambda 'return 0.5 * id(led_brightness_multiplier).state;'
                transition_length: 300ms
            - delay: 300ms
      # Now transition to target state with brightness multiplier applied
      - light.turn_on:
          id: led_rgb
          brightness: !lambda 'return target_brightness * id(led_brightness_multiplier).state;'
          red: !lambda 'return target_red;'
          green: !lambda 'return target_green;'
          blue: !lambda 'return target_blue;'
          white: 0%
          transition_length: 600ms
      - delay: 650ms
      - if:
          condition:
            lambda: 'return target_effect != "none";'
          then:
            - light.turn_on:
                id: led_rgb
                effect: !lambda 'return target_effect;'

  # Smooth fade out helper
  - id: led_fade_out
    then:
      - if:
          condition:
            light.is_on: led_rgb
          then:
            - light.turn_on:
                id: led_rgb
                brightness: 1%
                transition_length: 500ms
            - delay: 500ms
            - light.turn_off: led_rgb

  # Smooth fade in helper
  - id: led_fade_in
    parameters:
      brightness: float
      red: float
      green: float
      blue: float
      effect: string
    then:
      # Clear any running effects first
      - light.turn_on:
          id: led_rgb
          effect: none
      - light.turn_on:
          id: led_rgb
          brightness: 1%
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          white: 0%
          transition_length: 0s
      - delay: 50ms
      - light.turn_on:
          id: led_rgb
          brightness: !lambda 'return brightness * id(led_brightness_multiplier).state;'
          transition_length: 700ms
      - delay: 750ms
      - if:
          condition:
            lambda: 'return effect != "none";'
          then:
            - light.turn_on:
                id: led_rgb
                effect: !lambda 'return effect;'

  - id: update_led_state
    then:
      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() == "Manual Control";'
          then:
            - logger.log: "Setting LED to Manual Control mode"
            - script.execute: led_fade_out

      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() == "Environmental";'
          then:
            - logger.log: "Setting LED to Environmental mode"
            - script.execute: update_environmental_led

      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() == "Presence";'
          then:
            - logger.log: "Setting LED to Presence mode"
            # Check current occupancy and set appropriate state
            - if:
                condition:
                  lambda: 'return id(occupancy).state;'
                then:
                  - script.execute:
                      id: led_fade_in
                      brightness: 0.55
                      red: 0.0
                      green: 1.0
                      blue: 0.8
                      effect: "Presence Glow"
                else:
                  - script.execute: led_fade_out

  # Placeholder script for environmental LED updates
  # Real implementation is in co2-base.yaml for CO2-enabled builds
  - id: update_environmental_led
    then:
      # Default: turn off LED (no CO2 sensor available)
      - light.turn_on:
          id: led_rgb
          effect: none
      - delay: 50ms
      - light.turn_on:
          id: led_rgb
          brightness: 1%
          transition_length: 500ms
      - delay: 500ms
      - light.turn_off: led_rgb

switch:
  - platform: gpio
    name: "Relay Output"
    id: system_alarm_relay
    pin:
      number: GPIO12
      inverted: false
      ignore_strapping_warning: true

number:
  - platform: template
    name: "LED Brightness"
    id: led_brightness_multiplier
    icon: mdi:brightness-6
    entity_category: config
    min_value: 0.1
    max_value: 1.0
    initial_value: 1.0
    optimistic: true
    step: 0.05
    restore_value: true
    mode: slider
    on_value:
      then:
        # Refresh LED state when brightness changes
        - if:
            condition:
              lambda: 'return id(led_mode_select).current_option() != "Manual Control" && id(api_id).is_connected();'
            then:
              - script.execute: control_leds

button:
  - platform: restart
    name: "Restart Device"
    entity_category: config

