        device_class: occupancy
        disabled_by_default: true
      zone:
        name: "Target 1 Zone"
        disabled_by_default: true
        accuracy_decimals: 0
        state_class: measurement
    target_2:
      x:
        name: "Target 2 X"
        disabled_by_default: true
        unit_of_measurement: "mm"
        accuracy_decimals: 0
      y:
        name: "Target 2 Y"
        disabled_by_default: true
        unit_of_measurement: "mm"
        accuracy_decimals: 0
      signal:
        name: "Target 2 Signal"
        disabled_by_default: true
        accuracy_decimals: 0
        state_class: measurement
      active:
