# Everything Presence Pro — board-specific firmware.
#
# The model-agnostic core (zone-engine entities, shared API actions, logging,
# OTA, diagnostics) lives in epp-core.yaml / epp-entities.yaml / bh1750-base.yaml,
# which every variant includes alongside this file. What remains here is the
# hardware only the Pro has: the SK6812 status LED and its modes, the relay, the
# PIR, the SHTC3 temperature/humidity sensor, the DFRobot SEN0609 static-presence
# radar, and the Pro's I2C pinout.

esphome:
  project:
    name: EverythingSmartTechnology.Everything Presence Pro
  on_boot:
    - priority: 375
      then:
        - delay: 200ms
        # Start loading animation and keep it until API connects
        - light.turn_on:
            id: led_rgb
            brightness: 30%
            red: 0%
            green: 60%
            blue: 100%
            white: 0%
            effect: "Network Connecting"

epp:
  static_presence: dfrobot_presence
  motion_presence: pir_motion
  static_presence_output:
    name: "Static Presence"
    device_class: occupancy
    disabled_by_default: true
  motion_presence_output:
    name: "Motion Presence"
    device_class: motion
    disabled_by_default: true
  relay_switch: system_alarm_relay

globals:
  - id: env_temp_offset
    type: float
    initial_value: '0'
  - id: env_humidity_offset
    type: float
    initial_value: '0'
  - id: presence_color_red
    type: float
    restore_value: true
    initial_value: '0.8'
  - id: presence_color_green
    type: float
    restore_value: true
    initial_value: '0.2'
  - id: presence_color_blue
    type: float
    restore_value: true
    initial_value: '1.0'

api:
  actions:
    - action: epp_set_env_calibration
      variables:
        temperature_offset: float
        humidity_offset: float
        illuminance_offset: float
      then:
        - lambda: |-
            ESP_LOGI("epp", "epp_set_env_calibration: temperature_offset=%.1f humidity_offset=%.1f illuminance_offset=%.1f",
                     temperature_offset, humidity_offset, illuminance_offset);
            id(env_temp_offset) = temperature_offset;
            id(env_humidity_offset) = humidity_offset;
            id(env_illuminance_offset) = illuminance_offset;
            id(shtc3_sensor).update();
            id(illuminance_sensor).update();
    - action: epp_set_motion_timeout
      variables:
        timeout: float
      then:
        - lambda: |-
            ESP_LOGI("epp", "epp_set_motion_timeout: timeout=%.1f", timeout);
            // The PIR's debounce is a fixed 1s delayed_off (see pir_motion);
            // the real timeout is managed by the zone engine.
            id(epp_component).set_motion_timeout(timeout);
    - action: epp_set_static_presence
      variables:
        min_range: float
        max_range: float
        trigger_range: float
        sustain_sensitivity: int
        trigger_sensitivity: int
        on_delay: float
        led_enabled: bool
      then:
        - lambda: |-
            ESP_LOGI("epp", "epp_set_static_presence: min_range=%.1f max_range=%.1f trigger_range=%.1f sustain_sensitivity=%d trigger_sensitivity=%d on_delay=%.2f led_enabled=%s",
                     min_range, max_range, trigger_range, sustain_sensitivity, trigger_sensitivity, on_delay, led_enabled ? "true" : "false");
        - uart.write:
            id: uart_bus_dfrobot
            data: "sensorStop\r\n"
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setRange %.1f %.1f\r\n", min_range, max_range);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setTrigRange %.1f\r\n", trigger_range);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              auto ms = str_sprintf("setSensitivity %d %d\r\n", sustain_sensitivity, trigger_sensitivity);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              // Hardware timeout fixed at 1s for debounce; the real timeout
              // is managed by the zone engine via set_static_timeout()
              auto ms = str_sprintf("setLatency %.2f 1\r\n", on_delay);
              return std::vector<unsigned char>(ms.begin(), ms.end());
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: !lambda |-
              return led_enabled
                ? std::vector<unsigned char>{'s','e','t','L','e','d','M','o','d','e',' ','1',' ','0','\r','\n'}
                : std::vector<unsigned char>{'s','e','t','L','e','d','M','o','d','e',' ','1',' ','1','\r','\n'};
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: "saveConfig\r\n"
        - delay: 1s
        - uart.write:
            id: uart_bus_dfrobot
            data: "sensorStart\r\n"
    - action: epp_set_static_timeout
      variables:
        timeout: float
      then:
        - lambda: |-
            ESP_LOGI("epp", "epp_set_static_timeout: timeout=%.1f", timeout);
            // The DFRobot's hardware latency is fixed at 1s (see setLatency in
            // epp_set_static_presence); the real static timeout is a live
            // zone-engine value applied here WITHOUT any UART, so a timeout
            // change never triggers the ~8s sensor reconfigure/restart.
            id(epp_component).set_static_timeout(timeout);
    - action: epp_set_led
      variables:
        mode: string
        brightness: float
        presence_red: float
        presence_green: float
        presence_blue: float
      then:
        - lambda: |-
            ESP_LOGI("control_leds", "epp_set_led: mode=%s brightness=%.2f color=(%.2f, %.2f, %.2f)",
                     mode.c_str(), brightness, presence_red, presence_green, presence_blue);

            // Update presence color globals
            id(presence_color_red) = presence_red;
            id(presence_color_green) = presence_green;
            id(presence_color_blue) = presence_blue;

            // Update brightness
            auto call = id(led_brightness_multiplier).make_call();
            call.set_value(brightness);
            call.perform();

            // Update mode (triggers control_leds via on_value)
            auto mode_call = id(led_mode_select).make_call();
            mode_call.set_option(mode);
            mode_call.perform();
    - action: epp_set_relay
      variables:
        trigger_mode: string
        contact_mode: string
      then:
        - lambda: |-
            id(epp_component).set_relay(trigger_mode, contact_mode);
  on_client_connected:
    then:
      # Wait until client has subscribed
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 3s
      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() != "Manual Control";'
          then:
            # Stop any effects first
            - light.turn_on:
                id: led_rgb
                effect: none
            # Smooth celebration sequence with flowing colors
            - light.turn_on:
                id: led_rgb
                brightness: 60%
                red: 0%
                green: 100%
                blue: 100%
                white: 0%
                transition_length: 400ms
            - delay: 400ms
            - light.turn_on:
                id: led_rgb
                brightness: 65%
                red: 0%
                green: 70%
                blue: 100%
                white: 0%
                transition_length: 350ms
            - delay: 350ms
            - light.turn_on:
                id: led_rgb
                brightness: 70%
                red: 50%
                green: 0%
                blue: 100%
                white: 0%
                transition_length: 350ms
            - delay: 350ms
            - light.turn_on:
                id: led_rgb
                brightness: 65%
                red: 100%
                green: 100%
                blue: 100%
                white: 0%
                transition_length: 400ms
            - delay: 500ms
      # Always restore to current mode, even if Manual Control
      - script.execute: control_leds

  on_client_disconnected:
    then:
      - script.execute: control_leds

sensor:
  - platform: shtcx
    id: "shtc3_sensor"
    i2c_id: bus_a
    temperature:
      name: Temperature
      id: temperature_sensor
      disabled_by_default: true
      filters:
        - lambda: "return x + id(env_temp_offset);"
    humidity:
      name: Humidity
      id: humidity_sensor
      disabled_by_default: true
      filters:
        - lambda: "return x + id(env_humidity_offset);"
    address: 0x70
    update_interval: 30s

i2c:
  - id: bus_a
    scl: GPIO32
    sda: GPIO33
    scan: true

binary_sensor:
  - platform: gpio
    id: pir_motion
    internal: true
    pin:
      number: GPIO36
    filters:
      # Fixed 1s debounce. This used to read a motion_timeout global, but the
      # epp_set_motion_timeout action pinned that global to 1 and forwarded
      # the real timeout to the zone engine, so the lambda always returned
      # 1000 ms.
      - delayed_off: 1000ms

  # Mirror zone engine occupancy to trigger LED updates on state change
  - platform: template
    id: occupancy_led_trigger
    internal: true
    lambda: 'return id(epp_occupancy).state;'
    on_state:
      then:
        - if:
            condition:
              lambda: 'return id(led_mode_select).current_option() == "Presence" || id(led_mode_select).current_option() == "Environmental + Presence";'
            then:
              - script.execute: control_leds


light:
  - platform: esp32_rmt_led_strip
    id: led_rgb
    rgb_order: GRB
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    num_leds: 1
    chipset: sk6812
    name: "LED"
    effects:
      # Gentle breathing effects
      - pulse:
          name: "Slow Breathe"
          transition_length: 3s
          update_interval: 3s
          min_brightness: 5%
          max_brightness: 50%
      - pulse:
          name: "Medium Breathe"
          transition_length: 2s
          update_interval: 2s
          min_brightness: 10%
          max_brightness: 60%
      - pulse:
          name: "Fast Breathe"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 15%
          max_brightness: 70%

      # Presence detection effects - subtle, calming pulse
      - pulse:
          name: "Presence Glow"
          transition_length: 4s
          update_interval: 4s
          min_brightness: 40%
          max_brightness: 55%
      - pulse:
          name: "Presence Active"
          transition_length: 2.5s
          update_interval: 2.5s
          min_brightness: 45%
          max_brightness: 65%

      # Network status effects
      - pulse:
          name: "Network Connecting"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 20%
          max_brightness: 60%
      - strobe:
          name: "API Disconnected"
          colors:
            - state: true
              brightness: 20%
              red: 100%
              green: 0%
              blue: 100%
              white: 0%
              duration: 500ms
            - state: false
              duration: 2500ms

      # Environmental feedback effects
      # Good: No effect - steady glow
      - pulse:
          name: "Environmental Warning"
          transition_length: 1.5s
          update_interval: 1.5s
          min_brightness: 20%
          max_brightness: 50%
      - pulse:
          name: "Environmental Alert"
          transition_length: 800ms
          update_interval: 800ms
          min_brightness: 30%
          max_brightness: 65%

      # Smooth transition effects
      - pulse:
          name: "Gentle Fade"
          transition_length: 2s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%

select:
  - platform: template
    name: "LED Mode"
    id: led_mode_select
    internal: true
    entity_category: config
    optimistic: true
    options:
      - "Manual Control"
      - "Environmental"
      - "Presence"
      - "Environmental + Presence"
    initial_option: "Manual Control"
    restore_value: true
    icon: mdi:led-variant
    on_value:
      then:
        - script.execute: control_leds

script:
  - id: control_leds
    mode: restart
    then:
      - lambda: |
          ESP_LOGD("control_leds", "Called - api_connected (subscribed): %d, led_mode: %s",
                   id(api_id).is_connected(), id(led_mode_select).current_option().c_str());

          // No API connection
          if (!id(api_id).is_connected()) {
            ESP_LOGD("control_leds", "Executing control_leds_connecting (no API)");
            id(control_leds_connecting).execute();
          }
          // Manual control mode
          else if (id(led_mode_select).current_option() == "Manual Control") {
            ESP_LOGD("control_leds", "Executing control_leds_manual");
            id(control_leds_manual).execute();
          }
          // Environmental mode
          else if (id(led_mode_select).current_option() == "Environmental") {
            ESP_LOGD("control_leds", "Executing control_leds_environmental");
            id(control_leds_environmental).execute();
          }
          // Presence mode
          else if (id(led_mode_select).current_option() == "Presence") {
            ESP_LOGD("control_leds", "Executing control_leds_presence");
            id(control_leds_presence).execute();
          }
          // Environmental + Presence combined mode
          else if (id(led_mode_select).current_option() == "Environmental + Presence") {
            ESP_LOGD("control_leds", "Executing control_leds_environmental_presence");
            id(control_leds_environmental_presence).execute();
          }

  # Connection state - blue pulsing
  - id: control_leds_connecting
    then:
      - light.turn_on:
          id: led_rgb
          brightness: !lambda 'return 0.30 * id(led_brightness_multiplier).state;'
          red: 0%
          green: 60%
          blue: 100%
          white: 0%
          transition_length: 500ms
      - delay: 550ms
      # Only latch the looping effect if the API is STILL down. An ESPHome
      # config-entry reload (settings save that flips an entity's disabled_by)
      # produces a disconnect immediately followed by a reconnect; during this
      # 550ms delay a mode script (control_leds_manual/_presence/...) may have
      # already set the final LED state. Applying the effect unconditionally
      # would land after it and leave the LED stuck on "Network Connecting"
      # until the next client connect/disconnect. Re-checking here closes that
      # race — control_leds' `mode: restart` can't cancel this in-flight delay.
      - if:
          condition:
            lambda: 'return !id(api_id).is_connected();'
          then:
            - light.turn_on:
                id: led_rgb
                effect: "Network Connecting"

  # Manual control - turn off
  - id: control_leds_manual
    then:
      - logger.log: "control_leds_manual: Turning off LED"
      - light.turn_on:
          id: led_rgb
          effect: none
      - delay: 50ms
      - light.turn_on:
          id: led_rgb
          brightness: 1%
          transition_length: 500ms
      - delay: 500ms
      - light.turn_off: led_rgb
      - logger.log: "control_leds_manual: LED turned off"

  # Environmental mode
  - id: control_leds_environmental
    then:
      - script.execute: update_environmental_led

  # Presence mode
  - id: control_leds_presence
    then:
      - if:
          condition:
            lambda: 'return id(epp_occupancy).state;'
          then:
            # Presence detected - warm purple/magenta glow
            - light.turn_on:
                id: led_rgb
                effect: none
            - delay: 50ms
            - light.turn_on:
                id: led_rgb
                brightness: !lambda 'return 0.55 * id(led_brightness_multiplier).state;'
                red: !lambda 'return id(presence_color_red);'
                green: !lambda 'return id(presence_color_green);'
                blue: !lambda 'return id(presence_color_blue);'
                white: 0%
                transition_length: 600ms
            - delay: 650ms
            - light.turn_on:
                id: led_rgb
                effect: "Presence Glow"
          else:
            # No presence - turn off
            - light.turn_on:
                id: led_rgb
                brightness: 1%
                transition_length: 500ms
            - delay: 500ms
            - light.turn_off: led_rgb

  # Placeholder for Environmental + Presence combined mode
  # Real implementation is in co2-base.yaml for CO2-enabled builds
  - id: control_leds_environmental_presence
    then:
      # Default: just show presence (no CO2 sensor)
      - script.execute: control_leds_presence

  # Placeholder for alternating presence and environmental display
  # Real implementation is in co2-base.yaml for CO2-enabled builds
  - id: alternate_presence_environmental
    mode: restart
    then:
      # Default: just show presence (no CO2 sensor)
      - script.execute: control_leds_presence

  # DEPRECATED - kept for backwards compatibility with CO2
  # Smooth transition helper - fades out before changing state
  - id: led_smooth_transition
    parameters:
      target_brightness: float
      target_red: float
      target_green: float
      target_blue: float
      target_effect: string
    then:
      # Always clear effects first to prevent them from continuing
      - light.turn_on:
          id: led_rgb
          effect: none
      - if:
          condition:
            light.is_on: led_rgb
          then:
            # Fade to 50% brightness first for smooth transition
            - light.turn_on:
                id: led_rgb
                brightness: !lambda 'return 0.5 * id(led_brightness_multiplier).state;'
                transition_length: 300ms
            - delay: 300ms
      # Now transition to target state with brightness multiplier applied
      - light.turn_on:
          id: led_rgb
          brightness: !lambda 'return target_brightness * id(led_brightness_multiplier).state;'
          red: !lambda 'return target_red;'
          green: !lambda 'return target_green;'
          blue: !lambda 'return target_blue;'
          white: 0%
          transition_length: 600ms
      - delay: 650ms
      - if:
          condition:
            lambda: 'return target_effect != "none";'
          then:
            - light.turn_on:
                id: led_rgb
                effect: !lambda 'return target_effect;'

  # Smooth fade out helper
  - id: led_fade_out
    then:
      - if:
          condition:
            light.is_on: led_rgb
          then:
            - light.turn_on:
                id: led_rgb
                brightness: 1%
                transition_length: 500ms
            - delay: 500ms
            - light.turn_off: led_rgb

  # Smooth fade in helper
  - id: led_fade_in
    parameters:
      brightness: float
      red: float
      green: float
      blue: float
      effect: string
    then:
      # Clear any running effects first
      - light.turn_on:
          id: led_rgb
          effect: none
      - light.turn_on:
          id: led_rgb
          brightness: 1%
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          white: 0%
          transition_length: 0s
      - delay: 50ms
      - light.turn_on:
          id: led_rgb
          brightness: !lambda 'return brightness * id(led_brightness_multiplier).state;'
          transition_length: 700ms
      - delay: 750ms
      - if:
          condition:
            lambda: 'return effect != "none";'
          then:
            - light.turn_on:
                id: led_rgb
                effect: !lambda 'return effect;'

  - id: update_led_state
    then:
      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() == "Manual Control";'
          then:
            - logger.log: "Setting LED to Manual Control mode"
            - script.execute: led_fade_out

      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() == "Environmental";'
          then:
            - logger.log: "Setting LED to Environmental mode"
            - script.execute: update_environmental_led

      - if:
          condition:
            lambda: 'return id(led_mode_select).current_option() == "Presence";'
          then:
            - logger.log: "Setting LED to Presence mode"
            # Check current occupancy and set appropriate state
            - if:
                condition:
                  lambda: 'return id(epp_occupancy).state;'
                then:
                  - script.execute:
                      id: led_fade_in
                      brightness: 0.55
                      red: !lambda 'return id(presence_color_red);'
                      green: !lambda 'return id(presence_color_green);'
                      blue: !lambda 'return id(presence_color_blue);'
                      effect: "Presence Glow"
                else:
                  - script.execute: led_fade_out

  # Placeholder script for environmental LED updates
  # Real implementation is in co2-base.yaml for CO2-enabled builds
  - id: update_environmental_led
    then:
      # Default: turn off LED (no CO2 sensor available)
      - lambda: |-
          ESP_LOGD("control_leds", "update_environmental_led: no CO2 sensor, turning off");
      - light.turn_on:
          id: led_rgb
          effect: none
      - delay: 50ms
      - light.turn_on:
          id: led_rgb
          brightness: 1%
          transition_length: 500ms
      - delay: 500ms
      - light.turn_off: led_rgb

switch:
  - platform: gpio
    name: "Relay Output"
    id: system_alarm_relay
    pin:
      number: GPIO12
      inverted: false
      ignore_strapping_warning: true

number:
  - platform: template
    name: "LED Brightness"
    id: led_brightness_multiplier
    internal: true
    icon: mdi:brightness-6
    entity_category: config
    min_value: 0.1
    max_value: 1.0
    initial_value: 1.0
    optimistic: true
    step: 0.05
    restore_value: true
    mode: slider
    on_value:
      then:
        # Refresh LED state when brightness changes
        - if:
            condition:
              lambda: 'return id(led_mode_select).current_option() != "Manual Control" && id(api_id).is_connected();'
            then:
              - script.execute: control_leds

