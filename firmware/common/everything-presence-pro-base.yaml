esphome:
  project:
    name: EverythingSmartTechnology.Everything Presence Pro
    version: "0.99.0"
  on_boot:
    - priority: 200
      then:
        - lambda: |-
            id(logger_id).set_log_level(ESPHOME_LOG_LEVEL_NONE);
    - priority: 375
      then:
        - delay: 200ms
        # Start loading animation and keep it until API connects
        - light.turn_on:
            id: led_rgb
            brightness: 30%
            red: 0%
            green: 60%
            blue: 100%
            white: 0%
            effect: "Network Connecting"

external_components:
  - source:
      type: local
      path: ../components
    components: [epp]

epp:
  id: epp_component
  device_tracking:
    name: "Target Presence"
    device_class: occupancy
    disabled_by_default: true
  firmware_version:
