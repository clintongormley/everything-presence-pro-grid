    entity_category: diagnostic
  zone_occupancy:
    zone_0:
      name: "Zone 0 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_1:
      name: "Zone 1 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_2:
      name: "Zone 2 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_3:
      name: "Zone 3 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_4:
      name: "Zone 4 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_5:
      name: "Zone 5 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_6:
      name: "Zone 6 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_7:
      name: "Zone 7 Presence"
      device_class: occupancy
      disabled_by_default: true
  target_positions:
    target_0:
      name: "Target 1 Position"
      disabled_by_default: true
      entity_category: diagnostic
    target_1:
      name: "Target 2 Position"
      disabled_by_default: true
      entity_category: diagnostic
    target_2:
      name: "Target 3 Position"
      disabled_by_default: true
      entity_category: diagnostic
  raw_target_positions:
