# Shared variant defaults for the Everything Presence Lite — the substitutions /
# device_config block common to every Lite variant, included via `packages:`.
#
# Mirrors variant-defaults.yaml (the Pro's equivalent); see that file for how
# ESPHome's deep-merge lets a variant declare only its delta.
#
# The `has_*` flags are reported verbatim by the `get_build_flags` action and
# reach the panel through DeviceManager.list_devices(), which is what hides the
# controls for hardware this board does not have. They describe the PCB, not a
# user preference — a flag that disagrees with the hardware shows the user a
# control that silently does nothing.
substitutions:
  name: "everything-presence-lite"
  friendly_name: "Everything Presence Lite"
  hidden_ssid: "false"
  factory_reset_disabled: "true"
  uart_target_output_disabled: "true"
  uart_presence_output_disabled: "true"

  device_config:
    ethernet_enabled: false
    co2_enabled: true
    bluetooth_enabled: true
    board_revision: "1.0"
    # LD2450 only. The Lite's radar sits in a socket that also takes an LD2410 /
    # MR24HPC1 / SEN0395 / SEN0609, but the zone engine needs the LD2450's
    # per-target X/Y coordinates, so this firmware supports that module alone.
    sensor_variant: "ld2450"
    firmware_channel: "stable"
    model: "everything-presence-lite"
    has_temperature: false
    has_humidity: false
    has_illuminance: true
    has_motion_presence: false
    has_static_presence: false
    has_led: false
    has_relay: false
