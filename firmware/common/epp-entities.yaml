# Model-agnostic `epp:` entity definitions, shared by both model bases.
#
# Every zone / target / occupancy entity the zone engine publishes is identical
# across the Pro and the Lite — the engine itself is the same code. Inputs that
# only one board has (`static_presence`, `motion_presence`, their outputs, and
# `relay_switch`) are wired up in that board's own base, where the hardware
# they point at is defined.

epp:
  id: epp_component
  device_tracking:
    name: "Target Presence"
    device_class: occupancy
    disabled_by_default: true
  firmware_version:
    name: "Firmware Version"
    entity_category: diagnostic
  zone_occupancy:
    zone_0:
      name: "Zone 0 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_1:
      name: "Zone 1 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_2:
      name: "Zone 2 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_3:
      name: "Zone 3 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_4:
      name: "Zone 4 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_5:
      name: "Zone 5 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_6:
      name: "Zone 6 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_7:
      name: "Zone 7 Presence"
      device_class: occupancy
      disabled_by_default: true
  target_positions:
