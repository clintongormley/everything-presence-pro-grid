# Model-agnostic `epp:` entity definitions, shared by both model bases.
#
# The zone/target/occupancy entities here (zones, target positions/counts, the
# `Occupancy` output, LD2450 `tracking_health`) are identical across the Pro and
# the Lite — the engine itself is the same code. What lives in a board's own
# base instead: the inputs only that board has (`static_presence`,
# `motion_presence`, their outputs, `relay_switch`), and — Pro-only —
# `device_tracking` ("Target Presence") and `mmwave_output` ("mmWave Presence").
# Those two are LD2450/zone derived, but on a sensorless Lite they collapse into
# `Occupancy` (Target Presence is identical to it; mmWave a near-duplicate), so
# the Lite publishes `Occupancy` from the zone engine alone.

epp:
  id: epp_component
  # Connectivity of the LD2450 tracker itself — ON while frames are arriving
  # (even in an empty room, the LD2450 streams ~10Hz), OFF if it goes silent or
  # never comes up after boot. Distinct from Target Presence (targets seen): a
  # dead/disconnected tracker reads Disconnected here instead of looking like an
  # empty room (#407). Enabled by default so the fault is visible without
  # hunting through hidden entities.
  tracking_health:
    name: "Tracking Sensor"
    device_class: connectivity
    entity_category: diagnostic
  firmware_version:
    name: "Firmware Version"
    entity_category: diagnostic
  zone_occupancy:
    zone_0:
      name: "Zone 0 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_1:
      name: "Zone 1 Presence"
      device_class: occupancy
      disabled_by_default: true
    zone_2:
      name: "Zone 2 Presence"
      device_class: occupancy
