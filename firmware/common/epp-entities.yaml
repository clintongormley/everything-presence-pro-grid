    disabled_by_default: true
    entity_category: diagnostic
  target_entities:
    target_1:
      x:
        name: "Target 1 X"
        disabled_by_default: true
        unit_of_measurement: "mm"
        accuracy_decimals: 0
      y:
        name: "Target 1 Y"
        disabled_by_default: true
        unit_of_measurement: "mm"
        accuracy_decimals: 0
      signal:
