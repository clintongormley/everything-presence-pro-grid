# Shared path filters for dorny/paths-filter, used by the CI workflows to skip
# jobs that a change can't possibly affect. A doc-only change or a release
# version bump therefore no longer drags the whole matrix through.
#
# HOW THE SKIP STAYS SAFE WITH REQUIRED CHECKS: the "Main branch" ruleset marks
# Python/Frontend/C++/Hassfest/HACS as REQUIRED status checks. A required check
# that never posts blocks the PR forever, so we must NOT add workflow-level
# `paths:` filters to these workflows. Instead every workflow keeps triggering on
# all PRs, a `changes` job classifies the diff via this file, and each heavy job
# is gated with `if: needs.changes.outputs.<name> == 'true'`. A required job that
# is SKIPPED by its `if:` is treated as satisfied by the ruleset — green PR, no
# wasted compute.
#
# One carve-out the ruleset forces (see docs/developers/contributing.md): the
# Python and CodeQL jobs are MATRIX jobs. A job-level `if:` skip fires before the
# matrix expands, so the required "Python (HA …)" / "analyze (…)" contexts never
# post and the PR blocks. Those jobs gate at the STEP level instead, keeping the
# matrix (and its contexts) intact.
#
# Each filter includes the CI plumbing itself (this file + the relevant
# workflow), so editing CI re-runs the full suite that CI governs.

python:
  - 'custom_components/**'
  - 'tests/**'
  - '**/*.py'
  - 'requirements*.txt'
  - 'pyproject.toml'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

frontend:
  - 'frontend/**'
  # The committed, shipped bundles live outside frontend/ — include them so a
  # bundle-only change (rare, but possible) still runs the frontend checks.
  - 'custom_components/eppgrid/frontend/**'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

cpp:
  - 'firmware/**'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

docs:
  - 'docs/**'
  - '**/*.md'
  - 'mkdocs.yml'
  - 'requirements-docs.txt'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

# Hassfest + HACS validate the integration's manifest and structure — a bump of
# manifest.json must still run them, a doc-only change need not.
integration:
  - 'custom_components/**'
  - 'hacs.json'
  - '.github/workflows/hassfest.yml'
  - '.github/workflows/hacs.yml'
  - '.github/filters.yml'

# CodeQL analyses actual source, per language. These are narrower than the build
# filters above on purpose: a version bump touches only manifest.json (not a line
# of Python), so scanning the whole codebase for it would be pure waste — a
# source-file trigger keeps CodeQL off both bumps and docs. Underscored keys (not
# hyphens) so `outputs.codeql_python` isn't read as subtraction in an expression.
# Safe to gate only because the ruleset's code_scanning rule was removed; the
# "analyze (…)" status checks stay required (see codeql.yml header).
codeql_python:
  - '**/*.py'
  - '.github/workflows/codeql.yml'
  - '.github/filters.yml'
codeql_frontend:
  - 'frontend/**'
  # Also scan the shipped bundles, which live outside frontend/ (Copilot #426).
  - 'custom_components/eppgrid/frontend/**'
  - '.github/workflows/codeql.yml'
  - '.github/filters.yml'
codeql_cpp:
  - 'firmware/**'
  - '.github/workflows/codeql.yml'
  - '.github/filters.yml'
