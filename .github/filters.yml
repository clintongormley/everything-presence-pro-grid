# Shared path filters for dorny/paths-filter, used by the CI workflows to skip
# jobs that a change can't possibly affect. A doc-only change or a release
# version bump therefore no longer drags the whole matrix through.
#
# HOW THE SKIP STAYS SAFE WITH REQUIRED CHECKS: the "Main branch" ruleset marks
# Python/Frontend/C++/Hassfest/HACS as REQUIRED status checks. A required check
# that never posts blocks the PR forever, so we must NOT add workflow-level
# `paths:` filters to these workflows. Instead every workflow keeps triggering on
# all PRs, a `changes` job classifies the diff via this file, and each heavy job
# is gated with `if: needs.changes.outputs.<name> == 'true'`. A required job that
# is SKIPPED by its `if:` is treated as satisfied by the ruleset — green PR, no
# wasted compute.
#
# Two carve-outs the ruleset forces (see docs/developers/contributing.md):
#   - The Python and CodeQL jobs are MATRIX jobs. A job-level `if:` skip fires
#     before the matrix expands, so the required "Python (HA …)" / "analyze (…)"
#     contexts never post and the PR blocks. Those jobs gate at the STEP level
#     instead, keeping the matrix (and its contexts) intact.
#   - CodeQL is not gated at all: the ruleset's code_scanning rule requires
#     CodeQL results on every PR, so a skipped/no-op scan blocks the merge.
#
# Each filter includes the CI plumbing itself (this file + the relevant
# workflow), so editing CI re-runs the full suite that CI governs.

python:
  - 'custom_components/**'
  - 'tests/**'
  - '**/*.py'
  - 'requirements*.txt'
  - 'pyproject.toml'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

frontend:
  - 'frontend/**'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

cpp:
  - 'firmware/**'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

docs:
  - 'docs/**'
  - '**/*.md'
  - 'mkdocs.yml'
  - 'requirements-docs.txt'
  - '.github/workflows/tests.yml'
  - '.github/filters.yml'

# Hassfest + HACS validate the integration's manifest and structure — a bump of
# manifest.json must still run them, a doc-only change need not.
integration:
  - 'custom_components/**'
  - 'hacs.json'
  - '.github/workflows/hassfest.yml'
  - '.github/workflows/hacs.yml'
  - '.github/filters.yml'

# NB: CodeQL is deliberately NOT gated here — the ruleset's code_scanning rule
# requires CodeQL results on every PR, so codeql.yml always analyses all three
# languages regardless of the diff. See the header comment in codeql.yml.
