name: Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  cpp-tests:
    runs-on: ubuntu-latest
    name: C++ Tests
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Build and test
        run: |
          cd firmware/lib/epp_zone_engine
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          cd build && ctest --output-on-failure

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pushes to main compile every variant; PRs compile a subset to keep
        # the check fast, but that subset must cover both models — a Lite-only
        # firmware change is invisible to a Pro-only build.
        variant: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["wifi-ble-co2","ethernet-ble-co2","wifi-ble-lite","wifi-ble-lite-co2"]') || fromJSON('["wifi-ble-co2","wifi-ble-lite"]') }}
    name: "Compile ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Compile firmware
        # Build the firmware for whichever repository this workflow is running
        # in, so a fork's devices fetch updates from the fork's own Pages rather
        # than upstream's. `-s` is a global esphome option: placed after the
        # subcommand it is silently ignored, so it must precede `compile`.
        run: |
          # Lowercased because the owner also forms the GitHub Pages host in the
          # `update:` URL, and Pages serves the canonical lowercase hostname —
          # an owner with capitals would otherwise bake in a host that only
          # resolves by DNS case-insensitivity and never matches what a browser
          # or the docs site reports. GitHub redirects the repo path
          # case-insensitively, so the same value is safe for package_import_url.
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          esphome -s epp_repo_owner "${REPO%%/*}" \
                  -s epp_repo_name "${REPO#*/}" \
                  compile firmware/variants/${{ matrix.variant }}.yaml
