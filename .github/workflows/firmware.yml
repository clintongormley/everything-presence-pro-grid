name: Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  cpp-tests:
    runs-on: ubuntu-latest
    name: C++ Tests
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Build and test
        run: |
          cd firmware/lib/epp_zone_engine
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          cd build && ctest --output-on-failure

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pushes to main compile every variant; PRs compile a subset to keep
        # the check fast, but that subset must cover both models — a Lite-only
        # firmware change is invisible to a Pro-only build.
        variant: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["wifi-ble-co2","ethernet-ble-co2","wifi-ble-lite"]') || fromJSON('["wifi-ble-co2","wifi-ble-lite"]') }}
    name: "Compile ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Compile firmware
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
