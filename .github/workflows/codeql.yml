name: CodeQL

on:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
          - language: javascript-typescript
          - language: c-cpp
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build C++ (required for CodeQL)
        if: matrix.language == 'c-cpp'
        run: |
          cd firmware/lib/epp_zone_engine
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DEPP_BUILD_TOOLS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build
      - uses: github/codeql-action/analyze@v3
