name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'fw/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-firmware.sh'
  workflow_dispatch:
  workflow_run:
    workflows: ["Firmware Release"]
    types: [completed]
  # Re-deploy when a pre-release is promoted to a regular release
  # (`gh release edit v{X} --prerelease=false --latest=true`). Without this,
  # fw/latest/ would keep pointing at the previously-latest firmware until
  # the next push to main.
  release:
    types: [released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if triggered by a failed firmware-release run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Download latest release firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts fw
          # Every release builds firmware and gets marked as the latest
          # release (see .github/workflows/firmware-release.yml), so
          # /releases/latest always ships firmware binaries. Tolerate the
          # 404 case (no releases yet, or API hiccup) so docs can still
          # deploy without a release present.
          LATEST=$(gh api '/repos/${{ github.repository }}/releases/latest' --jq '.tag_name // ""' 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "No latest release found — Pages will have no fw/ content"
            exit 0
          fi
          echo "Latest release: $LATEST"
          gh release download "$LATEST" -D artifacts --pattern 'everything-presence-pro-*'
          if ! ls artifacts/*.bin >/dev/null 2>&1; then
            echo "::error::Latest release $LATEST has no firmware binaries — firmware-release workflow should attach them on every tag push"
            exit 1
          fi
          VERSION="${LATEST#v}" ARTIFACTS=artifacts ./.github/scripts/stage-firmware.sh
          # Also stage the version the *integration* pins itself to, even when
          # it is a prerelease that never becomes /releases/latest. The panel's
          # OTA button fetches fw/v{FIRMWARE_VERSION}/{variant}.json (Path B in
          # const.py), so a beta-pinned integration 404s on every OTA unless its
          # manifest is published here. STAGE_LATEST=0 leaves fw/latest/ on the
          # stable release above, so ESPHome's native update entity stays on it.
          # awk first-match-exit (POSIX, no PCRE; no `head -1`, so no SIGPIPE/141
          # under pipefail if const.py ever grows a second matching line) and
          # fail-soft: an unreadable/unmatched const.py prints nothing → PINNED
          # empty → warn and skip, never hard-fail the Pages deploy (docs +
          # fw/latest/) under `set -e -o pipefail`.
          # NOTE: FIRMWARE_VERSION is also parsed in .github/scripts/validate-release.sh
          # and bin/release.sh — keep the patterns in sync if const.py's line format changes.
          # `2>/dev/null || true`: a missing/unreadable const.py makes awk exit
          # non-zero, which under `set -e` would abort the whole deploy — swallow
          # it so the [ -z ] guard always gets to warn-and-skip (fail-soft).
          PINNED=$(awk -F'"' '/^FIRMWARE_VERSION[ \t]*=/{print $2; exit}' custom_components/eppgrid/const.py 2>/dev/null || true)
          if [ -z "$PINNED" ]; then
            echo "::warning::Could not read FIRMWARE_VERSION from const.py — skipping pinned OTA staging"
          elif [ "v$PINNED" != "$LATEST" ]; then
            echo "Pinned firmware v$PINNED differs from latest $LATEST — staging it for the OTA path"
            # A missing/empty pinned release IS a release-integrity error (the OTA
            # source of truth is gone), so fail loud here — same as the latest pass
            # above. In practice the pin always has a published release: every tag
            # builds firmware (firmware-release.yml) and this pass runs via
            # workflow_run after it, so the tag + binaries exist by now.
            rm -rf artifacts-pinned && mkdir -p artifacts-pinned
            gh release download "v$PINNED" -D artifacts-pinned --pattern 'everything-presence-pro-*'
            if ! ls artifacts-pinned/*.bin >/dev/null 2>&1; then
              echo "::error::Pinned release v$PINNED has no firmware binaries — the panel OTA path will 404"
              exit 1
            fi
            VERSION="$PINNED" ARTIFACTS=artifacts-pinned STAGE_LATEST=0 ./.github/scripts/stage-firmware.sh
          fi
      - name: Build mkdocs site
        run: mkdocs build --strict
      - name: Copy firmware manifests into site
        run: cp -r fw site/fw
      - name: Verify web flasher manifests are present
        run: |
          # docs/user-guide/web-flasher.md links firmware via
          # <esp-web-install-button manifest="../../fw/latest/{variant}.json">.
          # mkdocs --strict can't validate raw-HTML attribute paths, so confirm
          # the referenced manifests were actually staged — this catches a
          # variant-name drift between the page and stage-firmware.sh before it
          # ships a 404-ing flash button. Skip on the no-release bootstrap.
          if [ ! -d site/fw/latest ]; then
            echo "No staged firmware (no release yet) — skipping web flasher manifest check"
            exit 0
          fi
          count=0
          fail=0
          while IFS= read -r rel; do
            count=$((count + 1))
            target="site/user-guide/web-flasher/${rel}"
            if [ ! -f "$target" ]; then
              echo "::error::web-flasher.md references ${rel} but ${target} is missing — variant drift with stage-firmware.sh?"
              fail=1
            else
              echo "ok: ${rel}"
            fi
          done < <(grep -oE 'manifest="[^"]*"' docs/user-guide/web-flasher.md \
            | sed -E 's/manifest="([^"]*)"/\1/')
          if [ "$count" -eq 0 ]; then
            echo "::error::No manifest references found in docs/user-guide/web-flasher.md"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # A "successful" deploy doesn't guarantee the OTA manifests actually
      # serve: the Fastly CDN can 404 a just-published path or keep serving a
      # stale one, silently shipping a broken OTA that a user only hits when
      # their firmware upgrade fails. Poll the live manifest URLs — the panel's
      # fw/v{FIRMWARE_VERSION}/{variant}.json (Path B) and ESPHome's
      # fw/latest/{variant}.json — and fail the run if any isn't live+current,
      # so a bad deploy is caught here (re-run this workflow to redeploy+purge)
      # instead of by a user. Skips the no-release bootstrap (nothing staged).
      - name: Verify deployed firmware manifests are reachable
        # Interpolated context values go through env (not directly into run:),
        # the injection-safe pattern for workflow scripts.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          LATEST=$(gh api "/repos/$REPO/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "No latest release — no firmware staged, nothing to verify."
            exit 0
          fi
          # FIRMWARE_VERSION is the version the integration's OTA button pins to
          # (fw/v{PINNED}/). Same awk as the staging step above and
          # validate-release.sh — keep in sync if const.py's line format changes.
          # `2>/dev/null || true` so an unreadable const.py can't hard-fail the
          # step at the assignment under `set -e`; the guard below then emits a
          # clear, actionable error instead of running the verifier with an
          # empty --version (which would build bogus fw/v//… URLs).
          PINNED=$(awk -F'"' '/^FIRMWARE_VERSION[ \t]*=/{print $2; exit}' custom_components/eppgrid/const.py 2>/dev/null || true)
          if [ -z "$PINNED" ]; then
            echo "::error::could not parse FIRMWARE_VERSION from custom_components/eppgrid/const.py — cannot verify the pinned OTA manifests"
            exit 1
          fi
          # fw/latest only carries the variants in the promoted-latest release:
          # a variant newer than stable is staged under fw/v{pinned}/ but skipped
          # for fw/latest (stage-firmware.sh) until its release is promoted, so
          # checking fw/latest for it would 404. Derive the set from what staging
          # actually wrote rather than assuming every variant is in stable.
          LATEST_VARIANTS=$(find site/fw/latest -maxdepth 1 -name '*.json' -exec basename {} .json \; 2>/dev/null | paste -sd, -)
          python3 .github/scripts/verify_deployed_firmware.py \
            --base-url "$PAGE_URL" \
            --version "$PINNED" \
            --latest-version "${LATEST#v}" \
            --latest-variants "$LATEST_VARIANTS"
