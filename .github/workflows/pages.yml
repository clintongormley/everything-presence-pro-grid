name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'fw/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-firmware.sh'
      - '.github/scripts/firmware_versions_to_publish.py'
      - '.github/scripts/verify_deployed_firmware.py'
  workflow_dispatch:
  workflow_run:
    workflows: ["Firmware Release"]
    types: [completed]
  # Re-deploy when a pre-release is promoted to a regular release
  # (`gh release edit v{X} --prerelease=false --latest=true`). Without this,
  # fw/latest/ would keep pointing at the previously-latest firmware until
  # the next push to main.
  release:
    types: [released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if triggered by a failed firmware-release run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always main, whatever fired the run: on a promotion (`release`) the
      # event's ref is the release tag, which would deploy that tag's docs and
      # drop the firmware main pins. fetch-depth 0 brings the tags, whose
      # const.py firmware_versions_to_publish.py reads.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Download latest release firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts fw
          # Every release builds firmware and gets marked as the latest
          # release (see .github/workflows/firmware-release.yml), so
          # /releases/latest always ships firmware binaries. Tolerate the
          # 404 case (no releases yet, or API hiccup) so docs can still
          # deploy without a release present.
          LATEST=$(gh api '/repos/${{ github.repository }}/releases/latest' --jq '.tag_name // ""' 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "No latest release found — Pages will have no fw/ content"
            exit 0
          fi
          echo "Latest release: $LATEST"
          gh release download "$LATEST" -D artifacts --pattern 'everything-presence-pro-*'
          if ! ls artifacts/*.bin >/dev/null 2>&1; then
            echo "::error::Latest release $LATEST has no firmware binaries — firmware-release workflow should attach them on every tag push"
            exit 1
          fi
          VERSION="${LATEST#v}" ARTIFACTS=artifacts ./.github/scripts/stage-firmware.sh
          # Also publish every firmware version an installed integration pins
          # (FIRMWARE_VERSION): the panel's update tab fetches
          # fw/v{FIRMWARE_VERSION}/{variant}.json (Path B in const.py), and each
          # deploy rebuilds the site from scratch. That is main's pin (e.g. a
          # beta being tested) and the latest stable release's pin, which stays
          # on the previous firmware when a release changed only the integration
          # (tag v1.10.0 pins 1.9.0). STAGE_LATEST=0 leaves fw/latest/ on the
          # stable release above, for ESPHome's own update entity.
          # An assignment, so a failure in the script stops the step (`bash -e`
          # ignores one inside a `for ... in $(...)`).
          PINS=$(python3 .github/scripts/firmware_versions_to_publish.py --latest-tag "$LATEST")
          for PINNED in $PINS; do
            echo "Staging pinned firmware v$PINNED for the OTA path"
            # A pinned release without binaries IS a release-integrity error (the
            # OTA source of truth is gone), so fail loud, as for latest above.
            rm -rf artifacts-pinned && mkdir -p artifacts-pinned
            gh release download "v$PINNED" -D artifacts-pinned --pattern 'everything-presence-pro-*'
            if ! ls artifacts-pinned/*.bin >/dev/null 2>&1; then
              echo "::error::Pinned release v$PINNED has no firmware binaries — the panel OTA path will 404"
              exit 1
            fi
            VERSION="$PINNED" ARTIFACTS=artifacts-pinned STAGE_LATEST=0 ./.github/scripts/stage-firmware.sh
          done
      - name: Build mkdocs site
        run: mkdocs build --strict
      - name: Copy firmware manifests into site
        run: cp -r fw site/fw
      - name: Verify web flasher manifests are present
        run: |
          # docs/user-guide/web-flasher.md links firmware via
          # <esp-web-install-button manifest="../../fw/latest/{variant}.json">.
          # mkdocs --strict can't validate raw-HTML attribute paths, so confirm
          # the referenced manifests were actually staged — this catches a
          # variant-name drift between the page and stage-firmware.sh before it
          # ships a 404-ing flash button. Skip on the no-release bootstrap.
          if [ ! -d site/fw/latest ]; then
            echo "No staged firmware (no release yet) — skipping web flasher manifest check"
            exit 0
          fi
          count=0
          fail=0
          while IFS= read -r rel; do
            count=$((count + 1))
            target="site/user-guide/web-flasher/${rel}"
            if [ ! -f "$target" ]; then
              echo "::error::web-flasher.md references ${rel} but ${target} is missing — variant drift with stage-firmware.sh?"
              fail=1
            else
              echo "ok: ${rel}"
            fi
          done < <(grep -oE 'manifest="[^"]*"' docs/user-guide/web-flasher.md \
            | sed -E 's/manifest="([^"]*)"/\1/')
          if [ "$count" -eq 0 ]; then
            echo "::error::No manifest references found in docs/user-guide/web-flasher.md"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # A "successful" deploy doesn't guarantee the OTA manifests actually
      # serve: the Fastly CDN can 404 a just-published path or keep serving a
      # stale one, silently shipping a broken OTA that a user only hits when
      # their firmware upgrade fails. Poll the live manifest URLs —
      # fw/v{version}/{variant}.json for the latest release and for every pinned
      # FIRMWARE_VERSION (Path B), and ESPHome's fw/latest/{variant}.json — and
      # fail the run if any isn't live+current,
      # so a bad deploy is caught here (re-run this workflow to redeploy+purge)
      # instead of by a user. Skips the no-release bootstrap (nothing staged).
      - name: Verify deployed firmware manifests are reachable
        # Interpolated context values go through env (not directly into run:),
        # the injection-safe pattern for workflow scripts.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          LATEST=$(gh api "/repos/$REPO/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "No latest release — no firmware staged, nothing to verify."
            exit 0
          fi
          # Check exactly what staging wrote: each variant set comes from the
          # site, because a release only carries the variants that existed when
          # it was cut (stage-firmware.sh skips the others).
          # An empty set would verify nothing and pass, so it fails here instead.
          variants_in() {
            local found
            found=$(find "site/fw/$1" -maxdepth 1 -name '*.json' -exec basename {} .json \; 2>/dev/null | paste -sd, -)
            if [ -z "$found" ]; then
              echo "::error::no firmware manifests staged under fw/$1/" >&2
              return 1
            fi
            echo "$found"
          }
          # Assignments, not inline $(...): `bash -e` stops on a failing
          # command substitution only in an assignment.
          RELEASE_VARIANTS=$(variants_in "$LATEST")
          LATEST_VARIANTS=$(variants_in latest)
          python3 .github/scripts/verify_deployed_firmware.py \
            --base-url "$PAGE_URL" \
            --version "${LATEST#v}" \
            --variants "$RELEASE_VARIANTS" \
            --latest-version "${LATEST#v}" \
            --latest-variants "$LATEST_VARIANTS"
          PINS=$(python3 .github/scripts/firmware_versions_to_publish.py --latest-tag "$LATEST")
          for PINNED in $PINS; do
            PINNED_VARIANTS=$(variants_in "v$PINNED")
            python3 .github/scripts/verify_deployed_firmware.py \
              --base-url "$PAGE_URL" \
              --version "$PINNED" \
              --variants "$PINNED_VARIANTS"
          done
