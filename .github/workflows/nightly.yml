name: Nightly (latest deps)

# Runs the suite against the LATEST upstream dependencies — Home Assistant
# stable, beta and dev, latest aioesphomeapi, latest test deps, and frontend deps
# resolved fresh from package.json ranges — so a new upstream release that
# breaks us is caught here, on a schedule, rather than on the next push.
# Kept separate from tests.yml so its noise never blocks a PR. A failing run
# emails the repo owner (GitHub's default for scheduled-workflow failures).

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha-version: ["stable", "beta", "dev"]
    name: "Python (HA ${{ matrix.ha-version }}, latest deps)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install latest dependencies
        run: |
          python scripts/ci_ha_install.py "${{ matrix.ha-version }}" \
            --requirements requirements_test.txt \
            --extra "aioesphomeapi>=29.0.0"
      - name: Ruff lint
        run: ruff check custom_components/ tests/ firmware/ scripts/
      - name: Pytest
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    name: Frontend (latest deps)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Resolve dependencies fresh (ignore lockfile)
        run: npm install --no-package-lock
      - name: Biome lint
        run: npx biome check src/
      - name: Rollup build (fails on warnings)
        run: npm run build
      - name: Vitest
        run: npm test
      # happy-dom has no layout engine, so the unit suite above cannot see a
      # geometry regression at all (#338/#339 both passed it). Mirror tests.yml and
      # run the real-browser suite too — it is the only thing that can.
      - name: Install Chromium for browser-mode tests
        run: npx playwright install --with-deps chromium
      - name: Vitest browser mode (real layout)
        run: npm run test:browser
