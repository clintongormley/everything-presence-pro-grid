name: Firmware Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi-ble-co2
          - ethernet-ble-co2
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate source versions match tag
        run: .github/scripts/validate-release.sh "${{ steps.version.outputs.version }}"

      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Compile firmware
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUILD_DIR="firmware/variants/.esphome/build/everything-presence-pro/.pioenvs/everything-presence-pro"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${VARIANT}.ota.bin"
          cp "$BUILD_DIR/bootloader.bin" "dist/${VARIANT}-bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "dist/${VARIANT}-partitions.bin"
          cp "$BUILD_DIR/firmware.bin" "dist/${VARIANT}.bin"
      - name: Generate ESP Web Tools manifest
        run: |
          VER="${{ steps.version.outputs.version }}"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          OTA_MD5=$(md5sum "dist/${VARIANT}.ota.bin" | cut -d' ' -f1)
          cat > "dist/${VARIANT}-manifest.json" << EOF
          {
            "name": "Everything Presence Pro (${{ matrix.variant }})",
            "version": "$VER",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "${VARIANT}-bootloader.bin", "offset": 4096},
                  {"path": "${VARIANT}-partitions.bin", "offset": 32768},
                  {"path": "${VARIANT}.bin", "offset": 65536}
                ],
                "ota": {
                  "path": "${VARIANT}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          # Every release is published as a pre-release and is never auto-marked
          # the GitHub "latest". It still builds firmware from the current source
          # and ships it as release assets — integration-only releases attach a
          # rebuild of the unchanged firmware. Test it, then promote with
          # `bin/promote.sh <version>` (or manually:
          #   gh release edit v{VERSION} --prerelease=false --latest=true)
          # which flips it to latest and re-fires pages.yml to stage fw/latest/.
          prerelease: true
          make_latest: false
