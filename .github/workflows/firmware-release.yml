name: Firmware Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi-ble-co2
          - ethernet-ble-co2
          - wifi-lite-co2
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate source versions match tag
        run: .github/scripts/validate-release.sh "${{ steps.version.outputs.version }}"

      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Compile firmware
        # Build the firmware for whichever repository this workflow is running
        # in, so a fork's devices fetch updates from the fork's own Pages rather
        # than upstream's. `-s` is a global esphome option: placed after the
        # subcommand it is silently ignored, so it must precede `compile`.
        run: |
          # Lowercased because the owner also forms the GitHub Pages host in the
          # `update:` URL, and Pages serves the canonical lowercase hostname —
          # an owner with capitals would otherwise bake in a host that only
          # resolves by DNS case-insensitivity and never matches what a browser
          # or the docs site reports. GitHub redirects the repo path
          # case-insensitively, so the same value is safe for package_import_url.
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          esphome -s epp_repo_owner "${REPO%%/*}" \
                  -s epp_repo_name "${REPO#*/}" \
                  compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        run: |
          mkdir -p dist
          # ESPHome names the build dir after the config's resolved `name`,
          # which is per model (everything-presence-pro / -lite), not per
          # variant. Ask ESPHome rather than hardcoding it: this path was
          # pinned to the Pro's name, so the Lite job built successfully and
          # then failed on the copy below.
          DEVICE_NAME=$(esphome config "firmware/variants/${{ matrix.variant }}.yaml" \
            | awk '/^esphome:/{f=1} f && /^  name:/{print $2; exit}')
          test -n "$DEVICE_NAME" || { echo "::error::could not resolve device name"; exit 1; }
          BUILD_DIR="firmware/variants/.esphome/build/${DEVICE_NAME}/.pioenvs/${DEVICE_NAME}"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${VARIANT}.ota.bin"
          cp "$BUILD_DIR/bootloader.bin" "dist/${VARIANT}-bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "dist/${VARIANT}-partitions.bin"
          cp "$BUILD_DIR/firmware.bin" "dist/${VARIANT}.bin"
      - name: Generate ESP Web Tools manifest
        run: |
          VER="${{ steps.version.outputs.version }}"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          OTA_MD5=$(md5sum "dist/${VARIANT}.ota.bin" | cut -d' ' -f1)
          # The asset filenames keep one prefix (it is the project slug, not a
          # model claim), but `name` is what ESP Web Tools shows the user in the
          # flash dialog, so it has to name the board they are holding.
          case "${{ matrix.variant }}" in
            *lite*) MODEL="Everything Presence Lite" ;;
            *)      MODEL="Everything Presence Pro" ;;
          esac
          cat > "dist/${VARIANT}-manifest.json" << EOF
          {
            "name": "${MODEL} (${{ matrix.variant }})",
            "version": "$VER",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "${VARIANT}-bootloader.bin", "offset": 4096},
                  {"path": "${VARIANT}-partitions.bin", "offset": 32768},
                  {"path": "${VARIANT}.bin", "offset": 65536}
                ],
                "ota": {
                  "path": "${VARIANT}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
      - name: Build release notes from the changelog
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Prefer the curated, user-facing CHANGES.md section as the release
          # body. Tags with no changelog entry (e.g. pre-release betas) exit
          # non-zero and fall back to GitHub's auto-generated commit notes.
          if .github/scripts/extract-release-notes.sh "$TAG" > release-notes.md; then
            echo "from_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "from_changelog=false" >> "$GITHUB_OUTPUT"
            rm -f release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: false
          # Use the curated changelog section as the release body when present;
          # otherwise let GitHub generate notes from the commit log.
          body_path: ${{ steps.notes.outputs.from_changelog == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.from_changelog != 'true' }}
          # Every release is published as a pre-release and is never auto-marked
          # the GitHub "latest". It still builds firmware from the current source
          # and ships it as release assets — integration-only releases attach a
          # rebuild of the unchanged firmware. Test it, then promote with
          # `bin/promote.sh <version>` (or manually:
          #   gh release edit v{VERSION} --prerelease=false --latest=true)
          # which flips it to latest and re-fires pages.yml to stage fw/latest/.
          prerelease: true
          make_latest: false
