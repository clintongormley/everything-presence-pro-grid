name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Classify the diff once (see .github/filters.yml) so each job below can skip
  # when nothing it cares about changed. A skipped required check satisfies the
  # ruleset, so a doc-only or version-bump PR goes green without the full matrix.
  changes:
    runs-on: ubuntu-latest
    name: Detect changed paths
    # Fail OPEN: if the filter step errors (API change, transient outage), treat
    # every category as changed so the real jobs run. Skipping them instead
    # would make each required check go green-by-skip and silently bypass CI.
    outputs:
      python: ${{ steps.filter.outcome != 'success' && 'true' || steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outcome != 'success' && 'true' || steps.filter.outputs.frontend }}
      cpp: ${{ steps.filter.outcome != 'success' && 'true' || steps.filter.outputs.cpp }}
      docs: ${{ steps.filter.outcome != 'success' && 'true' || steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          filters: .github/filters.yml

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "2025.2.0"
            python-version: "3.13"
          - ha-version: "stable"
            python-version: "3.14"
          - ha-version: "dev"
            python-version: "3.14"
    name: "Python (HA ${{ matrix.ha-version }})"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            pip install git+https://github.com/home-assistant/core.git
            pip install "aioesphomeapi>=29.0.0"
            pip install -r requirements_test.txt
          elif [ "${{ matrix.ha-version }}" = "stable" ]; then
            pip install homeassistant
            pip install "aioesphomeapi>=29.0.0"
            pip install -r requirements_test.txt
          else
            # Declared-floor channel: resolve HA + aioesphomeapi + test deps in ONE
            # pip pass with HA pinned to the floor, so aioesphomeapi and transitive
            # deps (cryptography, zeroconf, …) backtrack to versions compatible with
            # that HA. Separate installs would force the latest aioesphomeapi (which
            # conflicts with the floor's pinned cryptography/zeroconf) and let the
            # unpinned phcc in requirements_test.txt silently upgrade HA off the floor.
            echo "homeassistant==${{ matrix.ha-version }}" > /tmp/ha-constraint.txt
            pip install "homeassistant==${{ matrix.ha-version }}" "aioesphomeapi>=29.0.0" \
              -r requirements_test.txt -c /tmp/ha-constraint.txt
          fi
      - name: Ruff lint
        run: ruff check custom_components/ tests/ firmware/
      - name: Ruff format
        run: ruff format --check custom_components/ tests/ firmware/
      - name: Mypy (type check)
        # Type-check on the floor job only: [tool.mypy] pins python_version and
        # sets ignore_missing_imports, so the result is HA-version-independent —
        # one run is enough. Mirrors the local pre-push hook, which was the ONLY
        # place mypy ran; CI itself never type-checked, so a union-attr
        # regression reached main via a GitHub merge (server-side merges don't
        # run the local hook).
        if: matrix.ha-version == '2025.2.0'
        run: mypy
      - name: Pytest
        run: pytest tests/ -v --cov=custom_components/eppgrid --cov-report=term-missing

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    name: Frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Biome lint
        run: npx biome check src/
      - name: Rollup build (fails on warnings)
        run: npm run build
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Install Chromium for browser-mode tests
        run: npx playwright install --with-deps chromium
      - name: Vitest browser mode (real layout)
        run: npm run test:browser

  cpp:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-latest
    name: C++ Tests
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake, lcov, and bc
        run: sudo apt-get update && sudo apt-get install -y cmake lcov bc
      - name: Build with coverage
        working-directory: firmware/lib/epp_zone_engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Coverage
          cmake --build build
      - name: Run tests
        working-directory: firmware/lib/epp_zone_engine/build
        run: ctest --output-on-failure
      - name: Check coverage
        working-directory: firmware/lib/epp_zone_engine
        run: |
          lcov --capture --directory build --output-file build/coverage.info \
              --ignore-errors inconsistent,format
          lcov --extract build/coverage.info '*/src/*.cpp' \
              --output-file build/coverage-filtered.info \
              --ignore-errors unused
          lcov --summary build/coverage-filtered.info
          COV=$(lcov --summary build/coverage-filtered.info 2>&1 \
              | grep 'lines\.\.' | sed 's/.*: *\([0-9][0-9]*\(\.[0-9][0-9]*\)\?\)%.*/\1/')
          if ! echo "$COV" | grep -q '^[0-9][0-9]*\(\.[0-9][0-9]*\)\?$'; then
            echo "::error::Failed to parse C++ coverage percentage from lcov output (got: '$COV')"
            exit 1
          fi
          echo "C++ line coverage: ${COV}%"
          if [ "$(echo "$COV < 90" | bc)" -eq 1 ]; then
            echo "::error::C++ coverage ${COV}% is below 90% threshold"
            exit 1
          fi
      - name: Generate HTML report
        if: always()
        working-directory: firmware/lib/epp_zone_engine
        run: |
          genhtml build/coverage-filtered.info --output-directory build/coverage-html \
              --ignore-errors inconsistent
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage-report
          path: firmware/lib/epp_zone_engine/build/coverage-html/

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the git-revision-date-localized plugin can read each
          # page's last-modified commit. A shallow clone makes it fall back with a
          # warning, which `mkdocs build --strict` would turn into a failure.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # Cache the pip downloads (mkdocs-material + plugins are sizeable),
          # keyed on requirements-docs.txt — mirrors the frontend job's npm cache.
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Check markdown formatting
        # mdformat with wrap=80 (from .mdformat.toml) + the gfm/mkdocs plugins
        # (pinned in requirements-docs.txt). Scope to every tracked markdown file
        # under docs/ plus README.md — untracked notes (docs/superpowers/) never
        # reach CI, so a plain `mdformat docs/` would never see them anyway.
        # `|| true` keeps a zero-match grep from tripping pipefail; `xargs -r`
        # then simply no-ops when there's nothing to check.
        run: git ls-files -- docs README.md | { grep '\.md$' || true; } | xargs -r mdformat --check
      - name: Build docs (strict — fails on broken links/nav)
        run: mkdocs build --strict
