[project]
name = "everything-presence-pro"
version = "0.0.0"
requires-python = ">=3.13"

[project.optional-dependencies]
firmware = ["esphome"]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "pytest-socket",
    "ruff",
    "mypy",
    "voluptuous-stubs",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "firmware/lib/*/build",
    "firmware/variants/.esphome",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["custom_components.eppgrid"]

[tool.pytest.ini_options]
addopts = "-p no:respx"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["custom_components/eppgrid"]
# Start pragmatic: catch real bugs without forcing every dict to be a TypedDict.
# Tighten incrementally as the codebase converges.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
# HA + aioesphomeapi don't ship complete stubs; suppress missing-import noise.
ignore_missing_imports = true

# Skip following imports into third-party packages — we type-check our own code,
# not HA / aioesphomeapi internals (and HA's source uses 3.14-only syntax that
# trips mypy's 3.13 parser).
[[tool.mypy.overrides]]
module = ["homeassistant.*", "aioesphomeapi.*"]
follow_imports = "skip"
