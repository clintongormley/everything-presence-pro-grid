# Project-scoped Codex config. Codex reads AGENTS.md, a git symlink to CLAUDE.md, so its
# one seat — /finish-branch's run-it reviewer, dispatched from a Claude session — follows
# the same repo rules as Claude. Codex only loads this file when the checkout path has a
# trust_level = "trusted" entry in ~/.codex/config.toml.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[sandbox_workspace_write]
# Codex closes sandbox network access by default. The run-it seat needs it open: the test
# install fetches dependencies and its experiments may talk to the Docker HA instance.
# Codex has no allowlist, so this is all-or-nothing; the sandbox still confines writes to
# the worktree.
network_access = true
